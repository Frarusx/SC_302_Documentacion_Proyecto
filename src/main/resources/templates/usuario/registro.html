<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentos :: cabecera(#{menu.registro})}"></head>
<body>
    <header th:replace="~{general/fragmentos :: menu}"></header>

    <main class="container py-5">
        <div class="tarjeta-formulario mx-auto">
            <p class="etiqueta-taller">[[#{inicio.visitante.etiqueta}]]</p>
            <h1 class="h2 fw-bold">[[#{registro.titulo}]]</h1>
            <p class="text-secondary">[[#{registro.texto}]]</p>

            <form th:action="@{/registro}" th:object="${formularioRegistro}" method="post" novalidate>

                <div class="mb-3">
                    <label class="form-label fw-semibold" for="nombre">[[#{registro.nombre}]]</label>
                    <input type="text" id="nombre" th:field="*{nombre}" class="form-control campo-taller" th:errorclass="campo-error"/>
                    <p class="mensaje-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></p>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold" for="correo">[[#{registro.correo}]]</label>
                    <input type="email" id="correo" th:field="*{correo}" class="form-control campo-taller" th:errorclass="campo-error"/>
                    <p class="mensaje-error" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></p>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold" for="telefono">[[#{registro.telefono}]]</label>
                    <input type="text" id="telefono" th:field="*{telefono}" class="form-control campo-taller" th:errorclass="campo-error"/>
                    <p class="mensaje-error" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></p>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold" for="contrasena">[[#{registro.contrasena}]]</label>
                    <input type="password" id="contrasena" th:field="*{contrasena}" class="form-control campo-taller" th:errorclass="campo-error"/>
                    <p class="mensaje-error" th:if="${#fields.hasErrors('contrasena')}" th:errors="*{contrasena}"></p>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold" for="confirmacion">[[#{registro.confirmacion}]]</label>
                    <input type="password" id="confirmacion" th:field="*{confirmacion}" class="form-control campo-taller" th:errorclass="campo-error"/>
                    <p class="mensaje-error" th:if="${#fields.hasErrors('confirmacion')}" th:errors="*{confirmacion}"></p>
                </div>

                <button type="submit" class="btn btn-taller w-100 mb-3">[[#{registro.boton}]]</button>
            </form>

            <a th:href="@{/login}">[[#{registro.tengo.cuenta}]]</a>
            <p class="text-secondary small mt-3 mb-0">[[#{registro.terminos}]]</p>
        </div>
    </main>

    <footer th:replace="~{general/fragmentos :: pie}"></footer>
    <th:block th:replace="~{general/fragmentos :: scripts}"></th:block>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentos :: cabecera(#{menu.ingresar})}"></head>
<body>
    <header th:replace="~{general/fragmentos :: menu}"></header>

    <main class="container py-5">
        <div class="tarjeta-formulario mx-auto">
            <p class="etiqueta-taller">[[#{inicio.visitante.etiqueta}]]</p>
            <h1 class="h2 fw-bold">[[#{login.titulo}]]</h1>
            <p class="text-secondary">[[#{login.texto}]]</p>

            <!-- Avisos: error generico, cierre de sesion y registro exitoso -->
            <div class="alert alert-danger py-2" th:if="${param.error}">[[#{login.error}]]</div>
            <div class="alert alert-info py-2" th:if="${param.salio}">[[#{login.salio}]]</div>
            <div class="alert alert-success py-2" th:if="${registrado}">[[#{registro.exito}]]</div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-semibold" for="correo">[[#{registro.correo}]]</label>
                    <input type="email" id="correo" name="correo" class="form-control campo-taller" required/>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold" for="contrasena">[[#{login.contrasena}]]</label>
                    <input type="password" id="contrasena" name="contrasena" class="form-control campo-taller" required/>
                </div>
                <button type="submit" class="btn btn-taller w-100 mb-3">[[#{login.boton}]]</button>
            </form>

            <a th:href="@{/registro}">[[#{login.sin.cuenta}]]</a>
            <p class="text-secondary small mt-3 mb-0">[[#{app.seguro}]]</p>
        </div>
    </main>

    <footer th:replace="~{general/fragmentos :: pie}"></footer>
    <th:block th:replace="~{general/fragmentos :: scripts}"></th:block>
</body>
</html>

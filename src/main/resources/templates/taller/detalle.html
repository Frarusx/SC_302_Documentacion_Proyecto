<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{general/fragmentos :: cabecera(#{app.nombre})}"></head>
<body>
    <header th:replace="~{general/fragmentos :: menu}"></header>
    <main class="container mt-4">
        <a class="btn btn-outline-primary btn-sm mb-3" th:href="@{/taller/catalogo}"><i class="fa-solid fa-arrow-left"></i> [[#{taller.volver.catalogo}]]</a>

        <!-- Errores del modulo de reservas (sin cupos, taller pasado, reserva duplicada, etc.) -->
        <div class="aviso-error" th:if="${error}" th:text="#{${error}}"></div>

        <div class="card shadow-sm tarjeta-taller">
            <div class="card-body p-4">
                <span class="badge bg-info text-dark mb-2" th:text="${taller.categoria.nombre}">Categoria</span>
                <h2 th:text="${taller.nombre}">Taller</h2>
                <p class="lead" th:text="${taller.descripcion}">Descripcion</p>
                <ul class="list-unstyled">
                    <li><strong>[[#{taller.fecha}]]:</strong> <span th:text="${#temporals.format(taller.fechaHora, 'dd/MM/yyyy HH:mm')}"></span></li>
                    <li><strong>[[#{taller.lugar}]]:</strong> <span th:text="${taller.lugar}"></span></li>
                    <li><strong>[[#{taller.instructor}]]:</strong> <span th:text="${taller.instructor.nombre}"></span></li>
                    <li><strong>[[#{taller.cupos}]]:</strong> <span th:text="${taller.cupos}"></span></li>
                    <li><strong>[[#{taller.precio}]]:</strong> <span th:text="'₡' + ${#numbers.formatDecimal(taller.precio, 1, 'COMMA', 2, 'POINT')}"></span></li>
                </ul>

                <!-- Modulo de reservas -->
                <div class="mt-3">
                    <span class="badge-taller estado-cancelada" th:if="${taller.cupos <= 0}">[[#{reserva.agotada}]]</span>
                    <th:block th:if="${taller.cupos > 0}">
                        <form sec:authorize="hasRole('CLIENTE')" th:action="@{/reserva/crear}" method="post">
                            <input type="hidden" name="tallerId" th:value="${taller.idTaller}">
                            <button type="submit" class="btn btn-taller">[[#{reserva.reservar}]]</button>
                        </form>
                        <a sec:authorize="isAnonymous()" class="btn btn-taller" th:href="@{/login}">[[#{reserva.iniciarSesion}]]</a>
                    </th:block>
                </div>
            </div>
        </div>
    </main>
    <footer th:replace="~{general/fragmentos :: pie}"></footer>
    <th:block th:replace="~{general/fragmentos :: scripts}"></th:block>
</body>
</html>

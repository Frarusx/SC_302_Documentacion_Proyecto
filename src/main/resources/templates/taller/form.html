<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{general/fragmentos :: cabecera(#{app.nombre})}"></head>
<body>
    <header th:replace="~{general/fragmentos :: menu}"></header>
    <main class="container mt-4">
        <h2 class="mb-3" th:text="${taller.idTaller == null} ? #{taller.nuevo} : #{taller.editar}">Taller</h2>

        <form class="card shadow-sm tarjeta-taller p-4" method="post" th:action="@{/taller/guardar}" th:object="${taller}">
            <input type="hidden" th:field="*{idTaller}"/>

            <div class="mb-3">
                <label class="form-label" for="nombre">[[#{taller.nombre}]]</label>
                <input class="form-control" id="nombre" th:field="*{nombre}" th:errorclass="is-invalid"/>
                <div class="invalid-feedback" th:errors="*{nombre}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="descripcion">[[#{taller.descripcion}]]</label>
                <textarea class="form-control" id="descripcion" rows="3" th:field="*{descripcion}" th:errorclass="is-invalid"></textarea>
                <div class="invalid-feedback" th:errors="*{descripcion}"></div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label" for="idCategoria">[[#{taller.categoria}]]</label>
                    <select class="form-select" id="idCategoria" name="idCategoria"
                            th:classappend="${#fields.hasErrors('categoria')} ? 'is-invalid'">
                        <option value="">[[#{taller.seleccione}]]</option>
                        <option th:each="c : ${categorias}" th:value="${c.idCategoria}" th:text="${c.nombre}"
                                th:selected="${taller.categoria != null and taller.categoria.idCategoria == c.idCategoria}">Cat</option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{categoria}"></div>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label" for="lugar">[[#{taller.lugar}]]</label>
                    <input class="form-control" id="lugar" th:field="*{lugar}" th:errorclass="is-invalid"/>
                    <div class="invalid-feedback" th:errors="*{lugar}"></div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label" for="fechaHora">[[#{taller.fecha}]]</label>
                    <input class="form-control" type="datetime-local" id="fechaHora" th:field="*{fechaHora}" th:errorclass="is-invalid"/>
                    <div class="invalid-feedback" th:errors="*{fechaHora}"></div>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label" for="cupos">[[#{taller.cupos}]]</label>
                    <input class="form-control" type="number" min="1" id="cupos" th:field="*{cupos}" th:errorclass="is-invalid"/>
                    <div class="invalid-feedback" th:errors="*{cupos}"></div>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label" for="precio">[[#{taller.precio}]]</label>
                    <input class="form-control" type="number" step="0.01" min="0" id="precio" th:field="*{precio}" th:errorclass="is-invalid"/>
                    <div class="invalid-feedback" th:errors="*{precio}"></div>
                </div>
            </div>

            <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="activo" th:field="*{activo}"/>
                <label class="form-check-label" for="activo">[[#{taller.activo.visible}]]</label>
            </div>

            <div>
                <button class="btn btn-taller" type="submit">[[#{taller.guardar}]]</button>
                <a class="btn btn-outline-secondary" th:href="@{/taller/mis-talleres}">[[#{taller.cancelar}]]</a>
            </div>
        </form>
    </main>
    <footer th:replace="~{general/fragmentos :: pie}"></footer>
    <th:block th:replace="~{general/fragmentos :: scripts}"></th:block>
</body>
</html>
